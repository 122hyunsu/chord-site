<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>기타 & 피아노 코드 모음</title>

  <!-- 애드센스 (승인 전이어도 있어도 됨) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7200452402177060"
     crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }
    input {
      padding: 6px;
      font-size: 14px;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      margin: 6px 0;
    }
  </style>
</head>

<body>

  <h1>기타 & 피아노 코드 모음</h1>
  <p>기타와 피아노에서 자주 쓰이는 기본 코드들을 정리했습니다.</p>

  <hr>

  <h2>코드 검색</h2>
  <input
    type="text"
    id="searchInput"
    placeholder="예: C, Dm, Em"
    onkeyup="searchChord()"
  >

  <p>※ 현재는 메이저 / 마이너 기본 코드만 제공됩니다.</p>

  <hr>

  <h2>메이저 코드</h2>
  <ul>
    <li class="chord-item"><a href="C.html">C</a></li>
    <li class="chord-item"><a href="D.html">D</a></li>
    <li class="chord-item"><a href="E.html">E</a></li>
    <li class="chord-item"><a href="F.html">F</a></li>
    <li class="chord-item"><a href="G.html">G</a></li>
    <li class="chord-item"><a href="A.html">A</a></li>
    <li class="chord-item"><a href="B.html">B</a></li>
  </ul>

  <h2>마이너 코드</h2>
  <ul>
    <li class="chord-item"><a href="Cm.html">Cm</a></li>
    <li class="chord-item"><a href="Dm.html">Dm</a></li>
    <li class="chord-item"><a href="Em.html">Em</a></li>
    <li class="chord-item"><a href="Fm.html">Fm</a></li>
    <li class="chord-item"><a href="Gm.html">Gm</a></li>
    <li class="chord-item"><a href="Am.html">Am</a></li>
    <li class="chord-item"><a href="Bm.html">Bm</a></li>
  </ul>

  <hr>

  <p><a href="privacy.html">개인정보처리방침</a></p>

  <script>
    function searchChord() {
      const input = document.getElementById("searchInput");
      const filter = input.value.toUpperCase();
      const items = document.getElementsByClassName("chord-item");

      for (let i = 0; i < items.length; i++) {
        const text = items[i].innerText.toUpperCase();
        if (text.includes(filter)) {
          items[i].style.display = "";
        } else {
          items[i].style.display = "none";
        }
      }
    }
  </script>

</body>
</html>
